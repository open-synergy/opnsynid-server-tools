scenarios:
  - name: "Copy Allowed OU - Replace"
    steps:
      - step: "Create OU A"
        action: "create"
        model: "operating.unit"
        save_as: "ou_a"
        values:
          name: "OU A"
          code: "OU-A-1"
          partner_id: "base.main_partner"
      - step: "Create OU B"
        action: "create"
        model: "operating.unit"
        save_as: "ou_b"
        values:
          name: "OU B"
          code: "OU-B-1"
          partner_id: "base.main_partner"
      - step: "Create OU C"
        action: "create"
        model: "operating.unit"
        save_as: "ou_c"
        values:
          name: "OU C"
          code: "OU-C-1"
          partner_id: "base.main_partner"
      - step: "Create source user"
        action: "create"
        model: "res.users"
        save_as: "source"
        values:
          login: "test_ou_replace_source@test.com"
          name: "Source Replace"
          assigned_operating_unit_ids:
            - - 6
              - 0
              - - "EVAL: registry['ou_a'].id"
                - "EVAL: registry['ou_b'].id"
      - step: "Create target user"
        action: "create"
        model: "res.users"
        save_as: "target"
        values:
          login: "test_ou_replace_target@test.com"
          name: "Target Replace"
          assigned_operating_unit_ids:
            - - 6
              - 0
              - - "EVAL: registry['ou_c'].id"
      - step: "Create wizard"
        action: "create"
        model: "base.copy_user_operating_unit"
        save_as: "wizard"
        context:
          active_ids: "EVAL: [registry['target'].id]"
        values:
          user_id: "EVAL: registry['source'].id"
          copy_allowed_ou: true
          allowed_ou_mode: "replace"
          copy_default_ou: false
      - step: "Run copy"
        action: "call"
        target: "wizard"
        method: "action_copy_operating_unit"
        context:
          active_ids: "EVAL: [registry['target'].id]"
      - step: "Assert target Allowed OU replaced"
        action: "assert"
        target: "target"
        asserts:
          assigned_operating_unit_ids:
            type: "m2m"
            check: "count"
            expected_count: 2

